name: Build ClickSigns for Minecraft 1.21.11

on:
  workflow_dispatch:
  push:
    branches:
      - build/1.21.11-fabric

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out ClickSigns
        uses: actions/checkout@v4

      - name: Check out ClickUI
        uses: actions/checkout@v4
        with:
          repository: Clickism/ClickUI
          ref: master
          path: clickui
          fetch-depth: 1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ClickUI 1.21.11 into Maven Local
        working-directory: clickui
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("settings.gradle.kts")
          text = settings.read_text()
          marker = '        version("1.21.1", "fabric-remap", "neoforge")'
          target = '        version("1.21.11", "fabric-remap")'
          if target not in text:
              text = text.replace(marker, marker + "\n" + target)
          settings.write_text(text)

          profile = Path("versions/1.21.11-fabric/gradle.properties")
          profile.parent.mkdir(parents=True, exist_ok=True)
          profile.write_text("""# Mod Properties
          mod.minecraft_version=1.21.11
          mod.publishing_target_minecraft_versions=1.21.11

          # Dependencies
          deps.fabric_loader=0.18.1
          deps.fabric_api=0.141.1+1.21.11
          deps.parchment=1.21.11:2025.12.20
          """)

          port_files = [
              "src/main/java/de/clickism/clickui/render/UiGraphics.java",
              "src/main/java/de/clickism/clickui/UiEventHandler.java",
              "src/main/java/de/clickism/clickui/event/events/KeyEvent.java",
              "src/main/java/de/clickism/clickui/util/versioning/KeyUtil.java",
              "src/main/java/de/clickism/clickui/elements/Button.java",
              "src/main/java/de/clickism/clickui/elements/Image.java",
              "src/main/java/de/clickism/clickui/elements/input/Checkbox.java",
          ]

          for file_name in port_files:
              path = Path(file_name)
              source = path.read_text().replace("26.1", "1.21.11")

              if path.name == "UiGraphics.java":
                  source = source.replace(
                      "//~ if < 1.21.11 '.outline' -> '.renderOutline'",
                      "//~ if < 26.1 '.outline' -> '.renderOutline'"
                  )
                  source = source.replace(
                      "//~ if < 1.21.11 '.text' -> '.drawString'",
                      "//~ if < 26.1 '.text' -> '.drawString'"
                  )
                  source = source.replace(
                      "//~ if < 1.21.11 '.extractTooltipBackground' -> '.renderTooltipBackground'",
                      "//~ if < 26.1 '.extractTooltipBackground' -> '.renderTooltipBackground'"
                  )
                  source = source.replace(
                      "net.minecraft.client.renderer.RenderType",
                      "net.minecraft.client.renderer.rendertype.RenderType"
                  )

              if path.name == "UiEventHandler.java":
                  source = source.replace(
                      "//~ if < 1.21.11 'extractRenderState' -> 'render'",
                      "//~ if < 26.1 'extractRenderState' -> 'render'"
                  )

              path.write_text(source)
          PY
          chmod +x gradlew
          ./gradlew :1.21.11-fabric:publishToMavenLocal --no-daemon --no-build-cache --rerun-tasks --stacktrace

      - name: Build ClickSigns 1.21.11
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("settings.gradle.kts")
          lines = settings.read_text().splitlines()
          keep = []
          for line in lines:
              stripped = line.strip()
              if stripped.startswith("version(") and "1.21.11" not in stripped:
                  continue
              if "vcsVersion = " in line:
                  line = '        vcsVersion = "1.21.11-fabric"'
              keep.append(line)
          settings.write_text("\n".join(keep) + "\n")

          stonecutter = Path("stonecutter.gradle.kts")
          text = stonecutter.read_text().replace(
              'stonecutter active "26.3-fabric"',
              'stonecutter active "1.21.11-fabric"'
          )
          stonecutter.write_text(text)

          compat_files = [
              "src/main/java/de/clickism/clicksigns/ui/UiUtil.java",
              "src/main/java/de/clickism/clicksigns/platform/fabric/FabricPlatform.java",
              "src/main/java/de/clickism/clicksigns/platform/fabric/FabricNetwork.java",
              "src/main/java/de/clickism/clicksigns/platform/fabric/datagen/ModBlockTagProvider.java",
              "src/main/java/de/clickism/clicksigns/platform/fabric/datagen/ModRecipeProvider.java",
              "src/main/java/de/clickism/clicksigns/platform/fabric/datagen/ModLootTableProvider.java",
              "src/main/java/de/clickism/clicksigns/platform/fabric/datagen/ModModelProvider.java",
              "src/main/java/de/clickism/clicksigns/entity/RoadSignBlockEntityRenderer.java",
              "src/main/java/de/clickism/clicksigns/render/RenderContext.java",
              "src/main/java/de/clickism/clicksigns/render/SignRenderPipelines.java",
              "src/main/java/de/clickism/clicksigns/block/RoadSignBlock.java",
          ]

          for file_name in compat_files:
              path = Path(file_name)
              source = path.read_text()
              source = source.replace("26.1", "26.2")
              source = source.replace("net.fabricmc.fabric.api.creativetab.v1", "net.fabricmc.fabric.api.itemgroup.v1")
              source = source.replace("CreativeModeTabEvents", "ItemGroupEvents")
              source = source.replace("modifyOutputEvent", "modifyEntriesEvent")
              source = source.replace("FabricPackOutput", "FabricDataOutput")
              source = source.replace("FabricTagsProvider", "FabricTagProvider")
              source = source.replace("FabricBlockLootSubProvider", "FabricBlockLootTableProvider")
              source = source.replace("getOrCreateRawBuilder", "getOrCreateTagBuilder")
              source = source.replace(".addElement(", ".add(")
              source = source.replace(
                  "BuiltInRegistries.BLOCK.getKey(ClickSignsBlocks.ROAD_SIGN.get())",
                  "ClickSignsBlocks.ROAD_SIGN.get()"
              )
              source = source.replace(
                  "net.fabricmc.fabric.api.client.datagen.v1.provider.FabricModelProvider",
                  "net.fabricmc.fabric.api.datagen.v1.provider.FabricModelProvider"
              )
              source = source.replace("net.minecraft.client.data.models", "net.minecraft.data.models")
              source = source.replace("serverboundPlay", "playC2S")
              source = source.replace("clientboundPlay", "playS2C")
              source = source.replace("PlayerLookup.level", "PlayerLookup.world")
              if path.name == "SignRenderPipelines.java":
                  source = source.replace("26.3", "26.4")
              if path.name == "UiUtil.java":
                  source = source.replace(
                      "net.minecraft.client.gui.GuiGraphicsExtractor",
                      "net.minecraft.client.gui.GuiGraphics"
                  )
              if path.name == "RoadSignBlock.java":
                  start = source.find("    //? if >= 1.21.1 && <26.3 {")
                  end = source.find("    *///?}", start)
                  if start >= 0 and end >= 0:
                      source = source[:start] + source[end + len("    *///?}"):]
                  marker = "    @Override\n    public BlockEntity newBlockEntity"
                  codec = (
                      "    public static final MapCodec<RoadSignBlock> CODEC =\n"
                      "        simpleCodec(RoadSignBlock::new);\n\n"
                      "    @Override\n"
                      "    protected @NotNull MapCodec<? extends BaseEntityBlock> codec() {\n"
                      "        return CODEC;\n"
                      "    }\n\n"
                  )
                  source = source.replace(marker, codec + marker)
              path.write_text(source)
          PY
          python3 - <<'PY'
          from pathlib import Path

          Path("src/main/java/de/clickism/clicksigns/platform/fabric/datagen/ModBlockTagProvider.java").write_text(r'''package de.clickism.clicksigns.platform.fabric.datagen;

import de.clickism.clicksigns.ClickSignsBlocks;
import net.fabricmc.fabric.api.datagen.v1.FabricDataOutput;
import net.fabricmc.fabric.api.datagen.v1.provider.FabricTagProvider;
import net.minecraft.core.HolderLookup;
import net.minecraft.tags.BlockTags;
import org.jspecify.annotations.NonNull;

import java.util.concurrent.CompletableFuture;

class ModBlockTagsProvider extends FabricTagProvider.BlockTagProvider {
    public ModBlockTagsProvider(
        FabricDataOutput output,
        CompletableFuture<HolderLookup.Provider> registriesFuture
    ) {
        super(output, registriesFuture);
    }

    @Override
    protected void addTags(HolderLookup.@NonNull Provider lookup) {
        builder(BlockTags.MINEABLE_WITH_PICKAXE)
            .add(ClickSignsBlocks.ROAD_SIGN.get());
    }
}
''')

          Path("src/main/java/de/clickism/clicksigns/platform/fabric/datagen/ModRecipeProvider.java").write_text(r'''package de.clickism.clicksigns.platform.fabric.datagen;

import de.clickism.clicksigns.ClickSigns;
import de.clickism.clicksigns.ClickSignsBlocks;
import net.fabricmc.fabric.api.datagen.v1.FabricDataOutput;
import net.fabricmc.fabric.api.datagen.v1.provider.FabricRecipeProvider;
import net.minecraft.core.HolderLookup;
import net.minecraft.data.recipes.RecipeOutput;
import net.minecraft.data.recipes.RecipeProvider;
import net.minecraft.tags.ItemTags;
import net.minecraft.world.item.Items;
import org.jetbrains.annotations.NotNull;

import java.util.concurrent.CompletableFuture;

class ModRecipeProvider extends FabricRecipeProvider {
    public ModRecipeProvider(
        FabricDataOutput output,
        CompletableFuture<HolderLookup.Provider> registriesFuture
    ) {
        super(output, registriesFuture);
    }

    @Override
    protected RecipeProvider createRecipeProvider(
        HolderLookup.Provider registryLookup,
        RecipeOutput output
    ) {
        return new RecipeProvider(registryLookup, output) {
            @Override
            public void buildRecipes() {
                shaped(RecipeCategory.DECORATIONS, ClickSignsBlocks.ROAD_SIGN.get(), 4)
                    .pattern("###")
                    .pattern("#*#")
                    .pattern("###")
                    .define('#', Items.IRON_INGOT)
                    .define('*', ItemTags.SIGNS)
                    .unlockedBy(getHasName(Items.IRON_INGOT), has(Items.IRON_INGOT))
                    .save(output);
            }
        };
    }

    @Override
    public @NotNull String getName() {
        return ClickSigns.identifier("recipes").toString();
    }
}
''')

          Path("src/main/java/de/clickism/clicksigns/platform/fabric/datagen/ModModelProvider.java").write_text(r'''package de.clickism.clicksigns.platform.fabric.datagen;

import de.clickism.clicksigns.ClickSignsBlocks;
import net.fabricmc.fabric.api.client.datagen.v1.provider.FabricModelProvider;
import net.fabricmc.fabric.api.datagen.v1.FabricDataOutput;
import net.minecraft.client.data.models.BlockModelGenerators;
import net.minecraft.client.data.models.ItemModelGenerators;
import net.minecraft.client.data.models.model.ModelTemplates;

class ModModelProvider extends FabricModelProvider {
    public ModModelProvider(FabricDataOutput output) {
        super(output);
    }

    @Override
    public void generateBlockStateModels(BlockModelGenerators generator) {
        generator.createTrivialCube(ClickSignsBlocks.ROAD_SIGN.get());
    }

    @Override
    public void generateItemModels(ItemModelGenerators generator) {
        generator.generateFlatItem(
            ClickSignsBlocks.ROAD_SIGN.get().asItem(),
            ModelTemplates.FLAT_ITEM
        );
    }
}
''')

          Path("src/main/java/de/clickism/clicksigns/entity/RoadSignBlockEntityRenderer.java").write_text(r'''package de.clickism.clicksigns.entity;

import com.mojang.blaze3d.vertex.PoseStack;
import de.clickism.clicksigns.render.RenderContext;
import de.clickism.clicksigns.render.RoadSignRenderer;
import de.clickism.clicksigns.sign.RoadSign;
import net.minecraft.client.renderer.MultiBufferSource;
import net.minecraft.client.renderer.blockentity.BlockEntityRenderer;
import net.minecraft.client.renderer.blockentity.BlockEntityRendererProvider;
import org.jspecify.annotations.NonNull;

import static net.minecraft.world.level.block.state.properties.BlockStateProperties.HORIZONTAL_FACING;

public class RoadSignBlockEntityRenderer implements BlockEntityRenderer<RoadSignBlockEntity> {
    private RoadSign defaultRoadSign = null;

    public RoadSignBlockEntityRenderer(BlockEntityRendererProvider.Context context) {
    }

    @Override
    public void render(
        @NonNull RoadSignBlockEntity entity,
        float partialTicks,
        @NonNull PoseStack stack,
        @NonNull MultiBufferSource source,
        int light,
        int overlay
    ) {
        var roadSign = roadSignToRender(entity);
        var direction = entity.getBlockState().getValue(HORIZONTAL_FACING);
        var renderer = new RoadSignRenderer(
            new RenderContext(stack, source, light, direction),
            roadSign
        );
        renderer.render();
    }

    private RoadSign roadSignToRender(RoadSignBlockEntity entity) {
        var roadSign = entity.roadSign();
        if (roadSign == null) {
            roadSign = getOrCreateDefault();
        }
        return roadSign;
    }

    private RoadSign getOrCreateDefault() {
        if (defaultRoadSign == null) {
            defaultRoadSign = RoadSign.createDefault();
        }
        return defaultRoadSign;
    }
}
''')

          Path("src/main/java/de/clickism/clicksigns/render/RenderContext.java").write_text(r'''package de.clickism.clicksigns.render;

import com.mojang.blaze3d.vertex.PoseStack;
import com.mojang.blaze3d.vertex.VertexConsumer;
import com.mojang.math.Axis;
import de.clickism.clickui.util.Util;
import net.minecraft.client.gui.Font;
import net.minecraft.client.renderer.MultiBufferSource;
import net.minecraft.client.renderer.rendertype.RenderType;
import net.minecraft.core.Direction;
import net.minecraft.util.FormattedCharSequence;

import java.util.function.BiConsumer;

public final class RenderContext {
    private final PoseStack stack;
    private final MultiBufferSource source;
    private final int light;
    private final Direction direction;
    private final TextureRenderer textureRenderer;

    public RenderContext(PoseStack stack, MultiBufferSource source, int light, Direction direction) {
        this.stack = stack;
        this.source = source;
        this.light = light;
        this.direction = direction;
        this.textureRenderer = new TextureRenderer(this);
    }

    public PoseStack stack() {
        return stack;
    }

    public MultiBufferSource source() {
        return source;
    }

    public int light() {
        return light;
    }

    public Direction direction() {
        return direction;
    }

    public TextureRenderer textureRenderer() {
        return textureRenderer;
    }

    public void withTranslation(float x, float y, float z, Runnable action) {
        stack.translate(x, y, z);
        action.run();
        stack.translate(-x, -y, -z);
    }

    public void withFlip(float blockWidth, Runnable action) {
        withPose(() -> {
            stack.translate(blockWidth / 2, 0, 0);
            rotate(Axis.YP, 180);
            stack.translate(-blockWidth / 2, 0, 0);
            action.run();
        });
    }

    public void rotate(Axis axis, float degrees) {
        stack.mulPose(axis.rotationDegrees(degrees));
    }

    public void withScale(float scale, Runnable action) {
        withPose(() -> {
            stack.scale(scale, scale, 1);
            action.run();
        });
    }

    public void withPose(Runnable action) {
        stack.pushPose();
        action.run();
        stack.popPose();
    }

    public void withTextTransform(Font font, Runnable action) {
        withPose(() -> {
            rotate(Axis.YP, 180);
            rotate(Axis.ZP, 180);
            stack.translate(0, -font.lineHeight, 0);
            action.run();
        });
    }

    public void submit(
        int order,
        RenderType renderType,
        BiConsumer<PoseStack.Pose, VertexConsumer> renderer
    ) {
        withTranslation(0, 0, order * RenderConstants.ELEMENT_STEP, () -> {
            var buffer = source.getBuffer(renderType);
            renderer.accept(stack.last(), buffer);
        });
    }

    public void submitText(
        int order,
        float x,
        float y,
        FormattedCharSequence string,
        boolean shadow,
        Font.DisplayMode mode,
        int lightCoords,
        int color,
        int backgroundColor,
        int outlineColor
    ) {
        withTranslation(0, 0, -order * RenderConstants.ELEMENT_STEP, () -> {
            var font = Util.font();
            font.drawInBatch(
                string,
                x,
                y,
                color,
                shadow,
                stack.last().pose(),
                source,
                mode,
                backgroundColor,
                lightCoords
            );
        });
    }
}
''')

          Path("src/main/java/de/clickism/clicksigns/render/SignRenderPipelines.java").write_text(r'''package de.clickism.clicksigns.render;

import de.clickism.clicksigns.ClickSigns;
import net.minecraft.client.renderer.rendertype.RenderType;
import net.minecraft.resources.Identifier;

public class SignRenderPipelines {
    private static final Identifier WHITE = ClickSigns.identifier("textures/misc/white.png");

    public static RenderType baseRenderType(Identifier texture) {
        return RenderType.entityTranslucentCull(texture);
    }

    public static RenderType elementRenderType(Identifier texture) {
        return baseRenderType(texture);
    }

    public static RenderType colorRenderType() {
        return baseRenderType(WHITE);
    }
}
''')
