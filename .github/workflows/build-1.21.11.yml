name: Build ClickSigns for Minecraft 1.21.11

on:
  workflow_dispatch:
  push:
    branches:
      - build/1.21.11-fabric

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out ClickSigns
        uses: actions/checkout@v4

      - name: Check out ClickUI
        uses: actions/checkout@v4
        with:
          repository: Clickism/ClickUI
          ref: master
          path: clickui
          fetch-depth: 1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ClickUI 1.21.11 into Maven Local
        working-directory: clickui
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("settings.gradle.kts")
          text = settings.read_text()
          marker = '        version("1.21.1", "fabric-remap", "neoforge")'
          target = '        version("1.21.11", "fabric-remap")'
          if target not in text:
              text = text.replace(marker, marker + "\n" + target)
          settings.write_text(text)

          profile = Path("versions/1.21.11-fabric/gradle.properties")
          profile.parent.mkdir(parents=True, exist_ok=True)
          profile.write_text("""# Mod Properties
          mod.minecraft_version=1.21.11
          mod.publishing_target_minecraft_versions=1.21.11

          # Dependencies
          deps.fabric_loader=0.18.1
          deps.fabric_api=0.141.1+1.21.11
          deps.parchment=1.21.11:2025.12.20
          """)

          port_files = [
              "src/main/java/de/clickism/clickui/render/UiGraphics.java",
              "src/main/java/de/clickism/clickui/UiEventHandler.java",
              "src/main/java/de/clickism/clickui/event/events/KeyEvent.java",
              "src/main/java/de/clickism/clickui/util/versioning/KeyUtil.java",
              "src/main/java/de/clickism/clickui/elements/Button.java",
              "src/main/java/de/clickism/clickui/elements/Image.java",
              "src/main/java/de/clickism/clickui/elements/input/Checkbox.java",
          ]

          for file_name in port_files:
              path = Path(file_name)
              source = path.read_text().replace("26.1", "1.21.11")

              if path.name == "UiGraphics.java":
                  source = source.replace(
                      "net.minecraft.client.renderer.RenderType",
                      "net.minecraft.client.renderer.rendertype.RenderType"
                  )
                  source = source.replace("graphics.outline(", "graphics.renderOutline(")
                  source = source.replace("graphics.text(", "graphics.drawString(")
                  source = source.replace(
                      "TooltipRenderUtil.extractTooltipBackground",
                      "TooltipRenderUtil.renderTooltipBackground"
                  )

              if path.name == "UiEventHandler.java":
                  source = source.replace(
                      "//~ if < 1.21.11 'extractRenderState' -> 'render'",
                      "//~ if < 26.1 'extractRenderState' -> 'render'"
                  )

              path.write_text(source)

          ui = Path("src/main/java/de/clickism/clickui/render/UiGraphics.java")
          print("UiGraphics port markers:")
          for number, line in enumerate(ui.read_text().splitlines(), 1):
              if number in (277, 326, 339, 352, 365) or "renderOutline" in line or "drawString" in line:
                  print(f"{number}: {line}")
          PY
          chmod +x gradlew
          ./gradlew :1.21.11-fabric:publishToMavenLocal --no-daemon --no-build-cache --rerun-tasks --stacktrace

      - name: Build ClickSigns 1.21.11
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :1.21.11-fabric:build --no-daemon --no-build-cache --rerun-tasks --stacktrace

      - name: Upload ClickSigns jar
        uses: actions/upload-artifact@v4
        with:
          name: ClickSigns-1.21.11-Fabric
          path: |
            1.21.11-fabric/build/libs/*.jar
            !1.21.11-fabric/build/libs/*-dev.jar
